# The project's ONLY dependency manifest (uv.lock pins it). requirements.txt is
# gone: Vercel builds from this file + uv.lock and installs `dependencies` only.
[project]
name = "mcx-vercel"
version = "3.0.0"
requires-python = ">=3.12"
# What the Vercel functions import (api/*.py and the lib/ modules they load).
# yfinance: /api/mcxprice and the valuation cron's price refresh. It pulls in
# pandas/numpy itself.
dependencies = [
    "yfinance>=0.2.0",
]

[project.optional-dependencies]
# Local jobs on the relay Mac (scripts/ and the lib/ modules only they load):
# relay / bhav / iCOMDEX / MCXCCL fetches (curl_cffi), Sharekhan XLS and MCX
# OI XLSX parsing (pandas + xlrd / openpyxl), Dhan OI + options paper trading
# (dhanhq < 2.1). Tests run with this extra.
local = [
    "curl_cffi>=0.5.0",
    "pandas>=2.0.0",
    "xlrd>=2.0.1",
    "openpyxl>=3.1.0",
    "dhanhq<2.1",
]
# One-off studies in research/.
research = [
    "numpy",
    "scipy",
    "lxml",
]

[tool.uv]
# No build step: this is an application, not a package.
package = false
